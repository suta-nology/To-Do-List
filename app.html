<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirailist — 未来リスト</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23c94060'/><text x='50%' y='56%' dominant-baseline='middle' text-anchor='middle' font-family='serif' font-size='17' fill='white'>未</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="app-page">

  <!-- ── HEADER ── -->
  <header class="app-header">
    <div class="header-inner">

      <div class="brand">
        <span class="brand-mark">未</span>
        <div>
          <h1 class="brand-title">Mirailist</h1>
          <span class="brand-kanji">未来リスト</span>
        </div>
      </div>

      <div class="progress-wrap">
        <span class="progress-label" id="progressLabel">0 / 0</span>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
      </div>

      <div class="header-right">
        <div class="lang-switcher">
          <button class="lang-btn" data-lang="ja" onclick="switchLang('ja')">JA</button>
          <button class="lang-btn" data-lang="id" onclick="switchLang('id')">ID</button>
          <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
        </div>

        <div class="user-chip">
          <div class="user-avatar" id="userAvatar">?</div>
          <span class="user-name"   id="userName"></span>
          <span class="tier-badge"  id="tierBadge">FREE</span>
          <button class="logout-btn" id="logoutBtn" onclick="logout()">⏻</button>
        </div>
      </div>

    </div>
  </header>

  <!-- ── APP BODY ── -->
  <div class="app-body">

    <!-- Left: Monthly Calendar -->
    <div class="calendar-col">
      <div class="cal-nav">
        <button class="cal-nav-btn" id="prevMonthBtn" onclick="prevMonth()">‹</button>
        <span class="cal-month-label" id="calMonthLabel">May 2026</span>
        <button class="cal-nav-btn" id="nextMonthBtn" onclick="nextMonth()">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <!-- Right: Day Detail Panel -->
    <aside class="day-panel" id="dayPanel"></aside>

  </div>

  <!-- ── TASK MODAL (notification bottom-sheet) ── -->
  <div class="task-modal" id="taskModal">
    <div class="task-modal-backdrop" onclick="closeTaskModal()"></div>
    <div class="task-modal-sheet">
      <div class="sheet-handle"></div>
      <p class="sheet-date" id="sheetDateLabel"></p>
      <div class="sheet-input-row">
        <span class="sheet-emoji">✅</span>
        <input
          type="text"
          id="sheetInput"
          class="sheet-input"
          placeholder="Type a task…"
          autocomplete="off"
          onkeydown="handleSheetKey(event)"
        />
      </div>
      <div class="sheet-actions">
        <button class="sheet-cancel-btn" id="sheetCancelBtn" onclick="closeTaskModal()">Cancel</button>
        <button class="sheet-add-btn"    id="sheetAddBtn"    onclick="addFromSheet()">Add Task</button>
      </div>
    </div>
  </div>

  <script src="js/lang.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
