<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirailist — Sign In</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23c94060'/><text x='50%' y='56%' dominant-baseline='middle' text-anchor='middle' font-family='serif' font-size='17' fill='white'>未</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">

  <!-- Language switcher (top-right) -->
  <div class="auth-topbar">
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="ja" onclick="switchLang('ja')">JA</button>
      <button class="lang-btn" data-lang="id" onclick="switchLang('id')">ID</button>
      <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
    </div>
  </div>

  <div class="auth-wrap">

    <!-- Brand -->
    <div class="auth-brand">
      <span class="auth-brand-icon">未</span>
      <h1 class="auth-brand-name" data-i18n="appTitle">Mirailist</h1>
      <p class="auth-brand-kanji">未来リスト</p>
      <p class="auth-brand-sub" data-i18n="appSub">Your future, one task at a time.</p>
    </div>

    <!-- Login card -->
    <div class="auth-card">
      <h2 class="auth-heading" data-i18n="loginHeading">Sign In</h2>
      <p class="auth-error" id="loginError"></p>

      <input class="auth-input" type="text" id="loginUsername"
        data-i18n-ph="usernamePh" placeholder="Username"
        autocomplete="username" onkeydown="handleLoginKey(event)" />

      <input class="auth-input" type="password" id="loginPassword"
        data-i18n-ph="passwordPh" placeholder="Password"
        autocomplete="current-password" onkeydown="handleLoginKey(event)" />

      <button class="auth-btn auth-btn-primary" onclick="login()" data-i18n="loginBtn">Sign In</button>

      <div class="auth-divider">or</div>

      <button class="auth-btn auth-btn-guest" onclick="loginAsGuest()" data-i18n="guestBtn">👤 Continue as Guest</button>

      <div class="auth-switch">
        <span data-i18n="noAccount">Don't have an account?</span>
        <a href="register.html" data-i18n="registerLink">Register →</a>
      </div>
    </div>

    <!-- Tier compare -->
    <div class="tier-compare">
      <div class="tier-item">
        <span class="tier-ci guest">G</span>
        <span class="tier-name" data-i18n="tierGuestLabel">Guest</span>
        <span class="tier-days" data-i18n="tierGuestDays">Today only</span>
      </div>
      <div class="tier-item">
        <span class="tier-ci free">F</span>
        <span class="tier-name" data-i18n="tierFreeLabel">Free</span>
        <span class="tier-days" data-i18n="tierFreeDays">Today only</span>
      </div>
      <div class="tier-item">
        <span class="tier-ci pro">P</span>
        <span class="tier-name" data-i18n="tierProLabel">Premium / Admin</span>
        <span class="tier-days" data-i18n="tierProDays">Up to 30 days</span>
      </div>
    </div>

  </div>

  <p class="auth-copy">© 2026 Sutanology · Mirailist 未来リスト</p>

  <script src="js/lang.js"></script>
  <script src="js/auth.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      if (redirectIfLoggedIn()) return;
      applyLang();
    });
  </script>
</body>
</html>
