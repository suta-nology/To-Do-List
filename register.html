<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirailist — Register</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23c94060'/><text x='50%' y='56%' dominant-baseline='middle' text-anchor='middle' font-family='serif' font-size='17' fill='white'>未</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">

  <!-- Language switcher -->
  <div class="auth-topbar">
    <div class="lang-switcher">
      <button class="lang-btn" data-lang="ja" onclick="switchLang('ja')">JA</button>
      <button class="lang-btn" data-lang="id" onclick="switchLang('id')">ID</button>
      <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
    </div>
  </div>

  <div class="auth-wrap">

    <!-- Brand -->
    <div class="auth-brand">
      <span class="auth-brand-icon">未</span>
      <h1 class="auth-brand-name" data-i18n="appTitle">Mirailist</h1>
      <p class="auth-brand-kanji">未来リスト</p>
      <p class="auth-brand-sub" data-i18n="appSub">Your future, one task at a time.</p>
    </div>

    <!-- Register card -->
    <div class="auth-card">
      <h2 class="auth-heading" data-i18n="registerHeading">Create Account</h2>
      <p class="auth-error" id="registerError"></p>

      <input class="auth-input" type="text" id="regUsername"
        data-i18n-ph="usernamePh" placeholder="Username"
        autocomplete="username" onkeydown="handleRegisterKey(event)" />

      <input class="auth-input" type="password" id="regPassword"
        data-i18n-ph="password6Ph" placeholder="Password (min. 6 characters)"
        autocomplete="new-password" onkeydown="handleRegisterKey(event)" />

      <input class="auth-input" type="password" id="regConfirm"
        data-i18n-ph="confirmPh" placeholder="Confirm password"
        autocomplete="new-password" onkeydown="handleRegisterKey(event)" />

      <button class="auth-btn auth-btn-primary" onclick="register()" data-i18n="registerBtn">Create Account</button>

      <div class="auth-switch">
        <a href="index.html" data-i18n="backToLogin">← Back to Sign In</a>
      </div>
    </div>

    <!-- Tier note -->
    <div class="tier-compare">
      <div class="tier-item" style="flex:none;padding:14px 16px;gap:10px;flex-direction:row;align-items:center;">
        <span class="tier-ci free" style="flex-shrink:0;">F</span>
        <div style="text-align:left;">
          <div class="tier-name" data-i18n="tierFreeLabel">Free</div>
          <div class="tier-days" data-i18n="tierFreeDays">Today only</div>
        </div>
      </div>
      <div class="tier-item" style="flex:none;padding:14px 16px;gap:10px;flex-direction:row;align-items:center;">
        <span class="tier-ci pro" style="flex-shrink:0;">P</span>
        <div style="text-align:left;">
          <div class="tier-name" data-i18n="tierProLabel">Pro / Admin</div>
          <div class="tier-days" data-i18n="tierProDays">Up to 30 days</div>
        </div>
      </div>
    </div>

  </div>

  <p class="auth-copy">© 2026 Sutanology · Mirailist 未来リスト</p>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/auth.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      if (redirectIfLoggedIn()) return;
      applyLang();
    });
  </script>
</body>
</html>
